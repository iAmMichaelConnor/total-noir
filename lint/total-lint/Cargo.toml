[package]
name = "total-lint"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Classifies the failure sources in compiled Noir circuits"
license = "Apache-2.0"
publish = false

[[bin]]
name = "total-lint"
path = "src/main.rs"

[lib]
name = "total_lint"
path = "src/lib.rs"

[dependencies]
acir = { version = "1.0.0-rc.3", git = "https://github.com/noir-lang/noir/", tag = "v1.0.0-rc.3", package = "acir", features = ["bn254"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
flate2 = "1"
num-bigint = "0.4"
