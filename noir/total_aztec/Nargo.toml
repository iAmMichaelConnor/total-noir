[package]
name = "total_aztec"
type = "lib"
compiler_version = ">=1.0.0"

[dependencies]
# aztec-nr v6.0.0. A consumer must depend on the same git tag so that both
# packages share one `aztec` crate (one PrivateContext and note types).
aztec = { git = "https://github.com/aztec-labs-eng/aztec-node", tag = "v6.0.0", directory = "noir-projects/aztec-nr/aztec" }
total = { path = "../total" }
