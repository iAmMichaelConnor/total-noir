name: Benchmarks

on:
  push:
   branches:
    - main
  pull_request:

env:
  NOIR_VERSION: 1.0.0
  BB_VERSION: 6.0.0

jobs:
  test:
    name: Benchmark library
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Nargo
        uses: noir-lang/noirup@v0.1.5
        with:
          toolchain: ${{env.NOIR_VERSION}}

      - name: Install bb
        run: |
          curl -L https://bbup.aztec.network | bash
          ~/.bb/bbup -v ${{ env.BB_VERSION }}
          echo "$HOME/.bb" >> "$GITHUB_PATH"
          sudo apt install libc++-dev

      - name: Build Noir benchmark programs
        working-directory: noir/total_bench
        run: nargo export

      - name: Generate gates report
        run: ./scripts/build-gates-report.sh

      # The diff action names its artifact after the report path, and artifact
      # names cannot contain a slash.
      - name: Copy the gates report to the repository root
        run: cp noir/total_bench/gates_report.json gates_report.json

      - name: Compare gates reports
        id: gates_diff
        uses: noir-lang/noir-gates-diff@dbe920a8dcc3370af4be4f702ca9cef29317bec1
        with:
          report: gates_report.json
          summaryQuantile: 0.9 # only display the 10% most significant circuit size diffs in the summary (defaults to 20%)

      - name: Store ACIR opcode benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: "ACIR Opcodes"
          tool: "customSmallerIsBetter"
          output-file-path: "noir/total_bench/benchmark-opcodes.json"
          gh-pages-branch: "gh-pages"
          benchmark-data-dir-path: "dev/bench"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.ref == 'refs/heads/main' }}
          comment-always: ${{ contains( github.event.pull_request.labels.*.name, 'bench-show') }}
          comment-on-alert: true
          alert-threshold: "101%"
          fail-on-alert: false
          max-items-in-chart: 50

      - name: Store gates benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: "Circuit Size"
          tool: "customSmallerIsBetter"
          output-file-path: "noir/total_bench/benchmark-circuit.json"
          gh-pages-branch: "gh-pages"
          benchmark-data-dir-path: "dev/bench"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.ref == 'refs/heads/main' }}
          comment-always: ${{ contains( github.event.pull_request.labels.*.name, 'bench-show') }}
          comment-on-alert: true
          alert-threshold: "101%"
          fail-on-alert: false
          max-items-in-chart: 50
          skip-fetch-gh-pages: true

      - name: Add gates diff to sticky comment
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: gates-diff
          # delete the comment in case changes no longer impact circuit sizes
          delete: ${{ !steps.gates_diff.outputs.markdown }}
          message: ${{ steps.gates_diff.outputs.markdown }}

      - name: Delete export files
        run: rm -rf noir/total_bench/export

      - name: Build Brillig benchmark programs
        working-directory: noir/total_bench
        run: nargo export --force-brillig

      - name: Generate brillig report
        run: ./scripts/build-brillig-report.sh

      # The diff action names its artifact after the report path, and artifact
      # names cannot contain a slash.
      - name: Copy the brillig report to the repository root
        run: cp noir/total_bench/brillig_report.json brillig_report.json

      - name: Compare brillig reports
        id: brillig_bytecode_diff
        uses: noir-lang/noir-gates-diff@dbe920a8dcc3370af4be4f702ca9cef29317bec1
        with:
          report: brillig_report.json
          header: |
            # Changes to Brillig bytecode sizes
          brillig_report: true
          summaryQuantile: 0.9 # only display the 10% most significant circuit size diffs in the summary (defaults to 20%)

      - name: Store brillig benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: "Brillig Bytecode Size"
          tool: "customSmallerIsBetter"
          output-file-path: "noir/total_bench/benchmark-brillig.json"
          gh-pages-branch: "gh-pages"
          benchmark-data-dir-path: "dev/bench"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.ref == 'refs/heads/main' }}
          comment-always: ${{ contains( github.event.pull_request.labels.*.name, 'bench-show') }}
          comment-on-alert: true
          alert-threshold: "101%"
          fail-on-alert: false
          max-items-in-chart: 50
          skip-fetch-gh-pages: true

      - name: Add brillig diff to sticky comment
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: brillig-diff
          # delete the comment in case changes no longer impact circuit sizes
          delete: ${{ !steps.brillig_bytecode_diff.outputs.markdown }}
          message: ${{ steps.brillig_bytecode_diff.outputs.markdown }}
